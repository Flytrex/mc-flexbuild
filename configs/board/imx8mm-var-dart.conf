INSTALL_DEBIAN_TARGET_ROOTFS="rootfs.tar.zst"

# Mission computer, for what the connectivity apps bring in after the rootfs hooks:
# - Wi-Fi comes up through the device tree's power sequence; Variscite's Wi-Fi script unbinds it
#   again and then fails (it needs libgpiod v2). The MC uses no Bluetooth. Both units are disabled.
# - dhcp_config's 10-dhcp-all.network (Name=*, DHCP=yes) has systemd-networkd take over every
#   interface: it strips the docker bridges' addresses, so the services cannot reach RabbitMQ, and
#   runs DHCP on the modem against NetworkManager, so LTE carries no data. NetworkManager manages
#   the network (and configure_usb.sh the USB link), so the file is removed.
export ROOTFS_POST_CMD=' \
	sudo rm -f "$RFSDIR/etc/systemd/system/multi-user.target.wants/variscite-wifi.service" \
		"$RFSDIR/etc/systemd/system/multi-user.target.wants/variscite-bt.service" \
		"$RFSDIR/etc/systemd/network/10-dhcp-all.network" \
'
