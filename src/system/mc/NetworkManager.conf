# wlan0 is the Remote ID access point, run by hostapd, so NetworkManager leaves it alone.
# emc_controller's "start wifi" bind-mounts /etc/mc/NetworkManager_managed_wlan0.conf over this file
# to use wlan0 as a Wi-Fi client during development.

[main]
plugins=ifupdown,keyfile

[ifupdown]
managed=false

[keyfile]
unmanaged-devices=interface-name:wlan0
